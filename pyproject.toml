[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurf"
version = "1.9.0"
description = "Option pricing, arbitrage-free volatility surfaces, Heston, SABR and local volatility, exotics, and hedging model risk, each validated against independent references."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elmar Farajov" }]
keywords = ["options", "implied volatility", "heston", "svi", "local volatility", "quantitative finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2.2",
    "matplotlib>=3.9",
    "plotly>=5.20",
    "yfinance>=0.2.54",
    "tzdata",
]

[project.urls]
Repository = "https://github.com/elmarfarajov/volatility-surface-lab"
Documentation = "https://github.com/elmarfarajov/volatility-surface-lab/tree/main/docs"
Changelog = "https://github.com/elmarfarajov/volatility-surface-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["build>=1.2", "twine>=5.0", "pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.8", "mypy>=1.10", "hypothesis>=6.100", "mpmath>=1.3", "QuantLib>=1.34", "py_lets_be_rational>=1.1"]

[project.scripts]
volsurf = "volsurf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volsurf = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: longer-running statistical or end-to-end tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E731"]

[tool.mypy]
# strict for the packages rebuilt day by day; the original modules join as they are revisited
python_version = "3.10"
strict = true
files = ["src/volsurf/analytic", "src/volsurf/gallery", "src/volsurf/market", "src/volsurf/numerics", "src/volsurf/smile", "src/volsurf/stochvol", "src/volsurf/localvol", "src/volsurf/exotics", "src/volsurf/risk", "src/volsurf/platform", "src/volsurf/cli.py"]

[[tool.mypy.overrides]]
# SciPy ships no type information (its stubs break mypy on Python 3.10); pandas and yfinance are used untyped
module = ["scipy.*", "mpmath.*", "QuantLib.*", "pandas.*", "yfinance.*", "plotly.*", "mpl_toolkits.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["volsurf"]
omit = ["*/__main__.py"]
