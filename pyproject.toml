[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurf"
version = "1.0.0"
description = "Option pricing, arbitrage-free volatility surfaces, Heston calibration and a delta-hedging model-risk lab."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elmar Farajov" }]
keywords = ["options", "implied volatility", "heston", "svi", "local volatility", "quantitative finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2.2",
    "matplotlib>=3.9",
    "plotly>=5.20",
    "yfinance>=0.2.54",
    "tzdata",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.8"]

[project.scripts]
volsurf = "volsurf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: longer-running statistical or end-to-end tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E731"]

[tool.coverage.run]
source = ["volsurf"]
omit = ["*/__main__.py"]
